<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="250" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Golden Rim -->
  <rect x="10" y="10" width="230" height="230" rx="52" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="5" filter="url(#shadow)" />

  <!-- Academic Crest Shield Outline -->
  <path d="M125 35 L190 60 V125 C190 170 125 205 125 205 C125 205 60 170 60 125 V60 L125 35 Z" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" />

  <!-- Open Book Symbol Base -->
  <path d="M80 162 C100 152 118 155 125 160 C132 155 150 152 170 162 V182 C150 172 132 175 125 180 C118 175 100 172 80 182 V162 Z" fill="url(#accentGrad)" opacity="0.9" />

  <!-- Central "EL" Monogram -->
  <!-- E -->
  <path d="M82 82 H118 V96 H98 V107 H114 V121 H98 V133 H118 V147 H82 V82 Z" fill="#FFFFFF" />
  <!-- L -->
  <path d="M132 82 H148 V133 H168 V147 H132 V82 Z" fill="url(#accentGrad)" />

  <!-- Sparkle / Excellence Star Accent -->
  <path d="M175 48 L178 57 L187 60 L178 63 L175 72 L172 63 L163 60 L172 57 Z" fill="#FDE047" />
  <circle cx="125" cy="50" r="3" fill="#FDE047" />
</svg>
